# The wall every Ticket clears. Ported from caddie and rolodeck-ai, with their
# gate order kept: audit first because a vulnerable dependency is a defect like any
# other, build last because it is the slowest.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour default, so a suite that wedges
    # is reported hours later as a red check with nothing readable attached.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `high` and above only. A moderate advisory in a build-time tool is not
      # worth blocking a merge on, and a wall that cries wolf gets turned off.
      #
      # This is not theoretical here: caddie pins next 16.3.3, which carries a
      # critical RCE in next/og (GHSA-vcvr-r3jv-pc5j, affects 16.2.0-16.3.5).
      # This repo pins 16.3.8 because of that, and this step is what keeps it so.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
