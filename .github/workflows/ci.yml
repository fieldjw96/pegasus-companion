# The wall every Ticket clears. Ported from caddie and rolodeck-ai, with their
# gate order kept: audit first because a vulnerable dependency is a defect like any
# other, build last because it is the slowest.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour default, so a suite that wedges
    # is reported hours later as a red check with nothing readable attached.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The gate: anything that actually ships, at `high` and above.
      #
      # `--omit=dev` is deliberate and was added after a real failure, not to
      # make a red check go away. On 2026-10-03 GHSA-vfj7-8cjw-p6xm was
      # published against `braces` with an affected range of `*` -- every
      # version, no patched release. It reaches this repo only as
      # eslint-config-next -> @next/eslint-plugin-next -> fast-glob ->
      # micromatch -> braces. `npm ls braces --omit=dev` is empty: it is lint
      # tooling and never reaches a user.
      #
      # npm's only offered fix was eslint-config-next@14.2.35, a major downgrade
      # incompatible with Next 16. Leaving the gate unscoped would have meant a
      # permanently red CI with no action that could clear it, and a wall that
      # cries wolf gets turned off. Scoping it keeps the gate meaningful: a
      # vulnerable runtime dependency still blocks the merge.
      #
      # The critical RCE in next/og that made this repo pin 16.3.8 rather than
      # caddie's 16.3.3 (GHSA-vcvr-r3jv-pc5j) is a production dependency, so it
      # would still be caught here.
      - run: npm audit --audit-level=high --omit=dev

      # Dev-dependency advisories are reported but do not block, so they stay
      # visible rather than becoming invisible. Review this output when a build
      # tool is next upgraded.
      - name: Dev-dependency advisories (informational, never fails)
        run: npm audit --audit-level=high || true

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
